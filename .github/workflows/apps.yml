# Builds and checks every deliverable on each push:
#   test     — version, typecheck, lint, dead code, API document, unit/integration tests (shared, server, kiosk core on both SQLite drivers)
#   web      — kiosk web app (PWA, served by the server at /kiosk/) + admin panel
#   android  — Android kiosk app (Capacitor): debug APK, plus a signed release APK when the keystore secrets exist
#   windows  — Windows kiosk installer (Electron, NSIS)
#   image    — the server + admin panel Docker image (Liara), started against PostgreSQL and checked
#   release  — manual runs with "release" ticked: a draft GitHub Release v<version> with all of the above
#              (see docs/release.md); nothing is published until someone presses "Publish release"
#   liara    — manual runs with "deploy to Liara" ticked: uploads this commit to the Liara app (docs/liara-deploy.md)
name: Apps

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a draft GitHub Release from this commit'
        type: boolean
        default: false
      deploy:
        description: 'Deploy the server and admin panel to Liara (secret LIARA_API_TOKEN, variable LIARA_APP)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

env:
  # Electron itself is only needed by the Windows packaging job (electron-builder downloads it there).
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: andishkadeh
          POSTGRES_PASSWORD: andishkadeh
          POSTGRES_DB: andishkadeh_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U andishkadeh"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://andishkadeh:andishkadeh@localhost:5432/andishkadeh_test?schema=public
      TEST_DATABASE_URL: postgresql://andishkadeh:andishkadeh@localhost:5432/andishkadeh_test?schema=public
      JWT_SECRET: ci-only-secret-0123456789abcdefghijkl
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - run: pnpm version:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - name: API document (docs/openapi.json) matches the contracts
        run: pnpm --filter @andishkadeh/server openapi && git diff --exit-code docs/openapi.json
      - run: pnpm test

  web:
    name: Web app (PWA) and admin panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - run: pnpm --filter @andishkadeh/kiosk run build:web
      - run: pnpm --filter @andishkadeh/admin run build
      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-web-app
          path: apps/kiosk/dist-web
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: admin-panel
          path: apps/admin/dist
          if-no-files-found: error

  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The runner image ships the Android SDK (ANDROID_HOME); Gradle installs a missing platform itself.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - name: Build web app and copy it into the Android project
        working-directory: apps/kiosk
        run: pnpm run android:sync
      - name: Debug APK
        working-directory: apps/kiosk/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Signed release APK
        if: env.KEYSTORE_BASE64 != ''
        working-directory: apps/kiosk/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore" ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Collect APKs
        run: |
          version=$(node -p "require('./apps/kiosk/package.json').version")
          mkdir -p out
          cp apps/kiosk/android/app/build/outputs/apk/debug/app-debug.apk "out/AndishkadehKiosk-${version}-debug.apk"
          if [ -f apps/kiosk/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp apps/kiosk/android/app/build/outputs/apk/release/app-release.apk "out/AndishkadehKiosk-${version}.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - name: Build and package (NSIS, x64)
        working-directory: apps/kiosk
        run: pnpm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/kiosk/release/*.exe
          if-no-files-found: error

  image:
    name: Server image (Docker)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: andishkadeh
          POSTGRES_PASSWORD: andishkadeh
          POSTGRES_DB: andishkadeh
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U andishkadeh"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t andishkadeh-server .
      - name: Start it as on Liara (production settings, empty database) and check it
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL='postgresql://andishkadeh:andishkadeh@localhost:5432/andishkadeh?schema=public' \
            -e JWT_SECRET=ci-only-secret-0123456789abcdefghijklmnop \
            -e PUBLIC_BASE_URL=https://andishkadeh.example.ir \
            -e SEED_ADMIN_PASSWORD=Admin@12345 -e SEED_OPERATOR_PASSWORD=Operator@12345 \
            andishkadeh-server
          for i in $(seq 1 60); do curl -sf localhost:3000/api/v1/health >/dev/null && break; sleep 2; done
          version=$(node -p "require('./apps/server/package.json').version")
          curl -sf localhost:3000/api/v1/health | tee /dev/stderr | grep -q "\"db\":\"ok\".*\"version\":\"$version\""
          curl -sf localhost:3000/admin/login | grep -q '<div id="root">'
          curl -sf -X POST localhost:3000/api/v1/admin/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Admin@12345"}' | grep -q '"token"'
          # A restart (new deploy) runs migrations and the seed again without the initial passwords.
          docker rm -f app >/dev/null
          docker run -d --name app --network host \
            -e DATABASE_URL='postgresql://andishkadeh:andishkadeh@localhost:5432/andishkadeh?schema=public' \
            -e JWT_SECRET=ci-only-secret-0123456789abcdefghijklmnop \
            -e PUBLIC_BASE_URL=https://andishkadeh.example.ir \
            andishkadeh-server
          for i in $(seq 1 60); do curl -sf localhost:3000/api/v1/health >/dev/null && break; sleep 2; done
          curl -sf localhost:3000/api/v1/health | grep -q '"db":"ok"'
      - name: Container log
        if: always()
        run: docker logs app 2>&1 | tail -60 || true

  liara:
    name: Deploy to Liara
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: [test, image]
    runs-on: ubuntu-latest
    env:
      LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
      LIARA_APP: ${{ vars.LIARA_APP }}
    steps:
      - name: Settings present
        run: |
          if [ -z "$LIARA_API_TOKEN" ] || [ -z "$LIARA_APP" ]; then
            echo "::error::Add the repository secret LIARA_API_TOKEN and the variable LIARA_APP (docs/liara-deploy.md)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @liara/cli@9
      # liara.json supplies platform, port, build location and the media disk.
      - run: liara deploy --app "$LIARA_APP" --api-token "$LIARA_API_TOKEN" --no-app-logs

  release:
    name: Draft release
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [test, web, android, windows, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version and release notes
        run: |
          version=$(node tools/release/version.mjs)
          if gh release view "v$version" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version already has a release or tag; raise the version (pnpm version:set) and add a CHANGELOG entry"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          node tools/release/version.mjs notes > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir out
          (cd artifacts/kiosk-web-app && zip -qr "../../out/AndishkadehKioskWeb-$VERSION.zip" .)
          (cd artifacts/admin-panel && zip -qr "../../out/AndishkadehAdmin-$VERSION.zip" .)
          cp artifacts/android-apk/*.apk artifacts/windows-installer/*.exe out/
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -l out
          if [ ! -f "out/AndishkadehKiosk-$VERSION.apk" ]; then
            printf '\n> APK این نسخه با کلید debug امضا شده و فقط برای آزمایش است؛ برای دستگاه‌های عملیاتی secretهای امضای اندروید را تعریف کنید (docs/release.md).\n' >> notes.md
          fi
      - name: Draft release
        run: gh release create "v$VERSION" out/* --draft --target "$GITHUB_SHA" --title "اندیشکده کشتی ایران $VERSION" --notes-file notes.md
